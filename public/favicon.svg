<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Phone / Notch Accent -->
  <rect x="220" y="44" width="72" height="8" rx="4" fill="#38bdf8" opacity="0.7" />

  <!-- Central MJG Letters -->
  <text x="256" y="275" font-family="'Segoe UI', 'Archivo', sans-serif" font-weight="900" font-size="150" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">MJG</text>

  <!-- Divider Line with Center Dot -->
  <path d="M100 322 L225 322 M287 322 L412 322" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="322" r="6" fill="#38bdf8" />

  <!-- ASSISTECH & IMPORTS -->
  <text x="256" y="375" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="34" letter-spacing="6" fill="#f8fafc" text-anchor="middle">ASSISTECH</text>
  <text x="256" y="420" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="24" letter-spacing="8" fill="#38bdf8" text-anchor="middle">&amp; IMPORTS</text>
</svg>